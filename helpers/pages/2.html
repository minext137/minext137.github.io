		<div class="contentArea">
			<p>针对手机“HP Smart”软件查找不到打印机的情况，我们给出以下方案</p>
			<p>查看你的打印机上方“无线图标”是否为闪烁状态，如果闪烁，请按以下方法重置。</p>
			<img src="../himg/2-1.png"/>
			<p>无线按钮>向右键按4下>点击ok>重置完成</p>
			<img src="../himg/2-2.png"/>
			<p>查看手机网络是否可以查找到打印机热点，如果可以请到软件尝试</p>
			<p>如果不行，请到惠普官网解决或售后。</p>
